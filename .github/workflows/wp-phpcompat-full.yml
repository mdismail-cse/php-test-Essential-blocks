name: WP PHP Compatibility FULL (combined report + screenshots)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Essential Blocks branch to test'
        required: true
        default: 'master' # <-- Change this to test any Essential Blocks branch

permissions:
  contents: read
  actions: write

jobs:
  phpcompat:
    name: Run compatibility per PHP version
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [7.4]

    steps:
      - name: Checkout Essential Blocks plugin
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/essential-blocks
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.ESSENTIAL_BLOCKS_PAT }}
          path: essential-blocks

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, phpcs, wp-cli
          extensions: mbstring, intl, curl, zip, xml, json

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y default-mysql-server chromium-browser wkhtmltopdf imagemagick xsltproc curl wget unzip git

      - name: Install PHPCompatibilityWP & phpcs installer
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "squizlabs/php_codesniffer:^3.0" "dealerdirect/phpcodesniffer-composer-installer:*" "phpcompatibility/phpcompatibility-wp:*" --no-interaction

          # Determine composer home directory
          COMPOSER_HOME=$(composer config --global home)
          echo "Composer home: $COMPOSER_HOME"

          # Add to PATH
          echo "$COMPOSER_HOME/vendor/bin" >> $GITHUB_PATH

          # Configure phpcs installed paths
          $COMPOSER_HOME/vendor/bin/phpcs --config-set installed_paths $COMPOSER_HOME/vendor/phpcompatibility/php-compatibility,$COMPOSER_HOME/vendor/phpcompatibility/phpcompatibility-paragonie,$COMPOSER_HOME/vendor/phpcompatibility/phpcompatibility-wp

          # Verify installation
          $COMPOSER_HOME/vendor/bin/phpcs -i

      - name: Prepare WordPress
        env:
          WP_DB_NAME: wp
          WP_DB_USER: root
          WP_DB_PASS: root
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE ${{ env.WP_DB_NAME }};' -u${{ env.WP_DB_USER }} -p${{ env.WP_DB_PASS }}
          wp core download --allow-root
          wp config create --dbname=${WP_DB_NAME} --dbuser=${WP_DB_USER} --dbpass="${WP_DB_PASS}" --dbhost=localhost --allow-root --extra-php <<PHP
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP

      - name: Install WordPress
        run: |
          wp core install --url="http://127.0.0.1:8080" --title="WP Test" --admin_user="admin" --admin_password="admin" --admin_email="admin@example.com" --skip-email --allow-root

      - name: Copy plugin into WP plugins dir
        run: |
          mkdir -p wp-content/plugins/essential-blocks
          cp -R essential-blocks/* wp-content/plugins/essential-blocks/ || true

      - name: Auto-update plugins and activate
        run: |
          wp plugin update --all --allow-root || true
          wp plugin activate essential-blocks --allow-root || true

      - name: Create Application Password for admin user
        run: |
          # Create application password for admin user
          APP_PASSWORD=$(wp user application-password create admin "GitHub Actions Screenshot" --porcelain --allow-root)
          echo "APP_PASSWORD=$APP_PASSWORD" >> $GITHUB_ENV
          echo "✅ Application password created for admin user"
          echo "Password (first 10 chars): ${APP_PASSWORD:0:10}..."

      - name: Start WP built-in server
        run: |
          nohup wp server --host=127.0.0.1 --port=8080 --path=. --allow-root > wpserver.log 2>&1 &
          sleep 10

      - name: Create report folders
        run: mkdir -p reports/${{ matrix.php }}/phpcompat reports/${{ matrix.php }}/fatal reports/${{ matrix.php }}/wpdebug reports/${{ matrix.php }}/screens

      - name: Run PHPCompatibility scan
        run: |
          phpcs \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion "${{ matrix.php }}" \
            --extensions=php \
            --report=full \
            --report-file=reports/${{ matrix.php }}/phpcompat/phpcompat-${{ matrix.php }}.txt \
            wp-content/plugins/essential-blocks || true

      - name: Save wp debug.log
        run: |
          if [ -f wp-content/debug.log ]; then
            cp wp-content/debug.log reports/${{ matrix.php }}/wpdebug/debug-${{ matrix.php }}.log || true
          fi

      - name: Login to WordPress admin (for HTML checks)
        run: |
          # Get login page to initialize cookies
          curl -sSL -c cookies.txt "http://127.0.0.1:8080/wp-login.php" -o /dev/null

          # Login with admin credentials using application password
          curl -sSL -b cookies.txt -c cookies.txt \
            -d "log=admin" \
            -d "pwd=$APP_PASSWORD" \
            -d "wp-submit=Log+In" \
            -d "redirect_to=http://127.0.0.1:8080/wp-admin/" \
            -d "testcookie=1" \
            "http://127.0.0.1:8080/wp-login.php" -o /dev/null

          # Verify login by checking admin page
          if curl -sSL -b cookies.txt "http://127.0.0.1:8080/wp-admin/" | grep -q "Dashboard"; then
            echo "✅ Successfully logged in to WordPress admin with application password"
          else
            echo "⚠️ Login may have failed, trying with regular password..."
            # Fallback to regular password
            curl -sSL -b cookies.txt -c cookies.txt \
              -d "log=admin" \
              -d "pwd=admin" \
              -d "wp-submit=Log+In" \
              -d "redirect_to=http://127.0.0.1:8080/wp-admin/" \
              -d "testcookie=1" \
              "http://127.0.0.1:8080/wp-login.php" -o /dev/null

            if curl -sSL -b cookies.txt "http://127.0.0.1:8080/wp-admin/" | grep -q "Dashboard"; then
              echo "✅ Logged in with regular password"
            else
              echo "⚠️ Login failed, but continuing..."
            fi
          fi

          # Wait a moment for session to stabilize
          sleep 2

      - name: Check admin/editor pages for fatal errors + save HTML
        run: |
          TARGETS=(
            "http://127.0.0.1:8080/wp-admin/admin.php?page=essential-blocks&tab=options admin"
            "http://127.0.0.1:8080/wp-admin/post-new.php?post_type=post editor_post"
            "http://127.0.0.1:8080/wp-admin/post-new.php?post_type=page editor_page"
          )
          for t in "${TARGETS[@]}"; do
            url=$(echo "$t" | awk '{print $1}')
            name=$(echo "$t" | awk '{print $2}')
            out_html="reports/${{ matrix.php }}/fatal/${name}.html"
            curl -sSL -b cookies.txt -c cookies.txt "$url" -o "$out_html" || true
            if grep -Ei "fatal error|parse error|uncaught|exception" "$out_html" >/dev/null 2>&1; then
              echo "[FATAL] $url" >> reports/${{ matrix.php }}/fatal/fatal-${{ matrix.php }}.log
              grep -Ei "fatal error|parse error|uncaught|exception" -n "$out_html" >> reports/${{ matrix.php }}/fatal/fatal-${{ matrix.php }}.log
            else
              echo "OK: $url" >> reports/${{ matrix.php }}/fatal/fatal-${{ matrix.php }}.log
            fi
          done

      - name: Take viewport screenshots (1920x1080) JPEG
        run: |
          SCREEN_DIR=reports/${{ matrix.php }}/screens
          mkdir -p "$SCREEN_DIR"

          # Create a Node.js script that uses Application Password for authentication
          cat > screenshot.js <<'ENDJS'
          const puppeteer = require('puppeteer');

          (async () => {
            const args = process.argv.slice(2);
            const targetUrl = args[0];
            const outputFile = args[1];
            const appPassword = args[2];

            console.log('🚀 Launching browser...');
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });

            console.log('🔐 Authenticating with Application Password...');

            // Set HTTP Basic Auth header using application password
            const authHeader = 'Basic ' + Buffer.from('admin:' + appPassword).toString('base64');
            await page.setExtraHTTPHeaders({
              'Authorization': authHeader
            });

            // Alternative: Use cookies-based login
            // Go to login page
            await page.goto('http://127.0.0.1:8080/wp-login.php', { waitUntil: 'networkidle2' });

            // Fill in login form with application password
            await page.type('#user_login', 'admin');
            await page.type('#user_pass', appPassword);

            // Click login button and wait for navigation
            try {
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 10000 }),
                page.click('#wp-submit')
              ]);
              console.log('✅ Logged in successfully');
            } catch (error) {
              console.log('⚠️ Login navigation timeout, but continuing...');
            }

            // Navigate to target URL
            console.log('📸 Navigating to:', targetUrl);
            await page.goto(targetUrl, { waitUntil: 'networkidle2', timeout: 30000 });

            // Wait for page to fully load (use setTimeout instead of deprecated waitForTimeout)
            await new Promise(resolve => setTimeout(resolve, 3000));

            // Check if we're still on login page (login failed)
            const currentUrl = page.url();
            if (currentUrl.includes('wp-login.php')) {
              console.log('⚠️ Still on login page - authentication may have failed');
              console.log('Current URL:', currentUrl);
            } else {
              console.log('✅ Successfully navigated to target page');
              console.log('Current URL:', currentUrl);
            }

            // Take screenshot
            await page.screenshot({ path: outputFile, fullPage: false });
            console.log('✅ Screenshot saved to:', outputFile);

            await browser.close();
          })();
          ENDJS

          # Install Puppeteer
          echo "📦 Installing Puppeteer..."
          npm install puppeteer

          TARGETS=(
            "http://127.0.0.1:8080/wp-admin/admin.php?page=essential-blocks&tab=options admin"
            "http://127.0.0.1:8080/wp-admin/post-new.php?post_type=post editor_post"
            "http://127.0.0.1:8080/wp-admin/post-new.php?post_type=page editor_page"
          )

          for t in "${TARGETS[@]}"; do
            url=$(echo "$t" | awk '{print $1}')
            name=$(echo "$t" | awk '{print $2}')
            pngfile="$SCREEN_DIR/${{ matrix.php }}_${name}.png"
            jpgfile="$SCREEN_DIR/${{ matrix.php }}_${name}.jpg"

            echo "📸 Taking screenshot of: $name"
            # Take screenshot with Puppeteer using application password
            node screenshot.js "$url" "$pngfile" "$APP_PASSWORD" || echo "❌ Screenshot failed for $url"

            # Convert to JPEG
            if [ -f "$pngfile" ]; then
              convert "$pngfile" -quality 85 "$jpgfile" || cp "$pngfile" "$jpgfile"
              rm -f "$pngfile"
              echo "✅ Saved: $jpgfile"
            fi
          done

      - name: Upload per-PHP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perphp-reports-${{ matrix.php }}
          path: reports/${{ matrix.php }}
          retention-days: 7

  combine:
    name: Combine all PHP reports into single HTML + PDF (with screenshots)
    runs-on: ubuntu-latest
    needs: phpcompat

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allreports

      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y wkhtmltopdf imagemagick

      - name: Build combined HTML
        run: |
          mkdir -p final
          cat > final/combined.html <<'HTML'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8"/>
          <title>Essential Blocks - Combined PHP Compatibility Report</title>
          <style>
          body { font-family: Arial; line-height:1.4; margin:20px; color:#222 }
          pre { background:#f6f6f6; padding:10px; border-radius:6px; overflow:auto }
          h1,h2,h3 { color:#111 }
          .screenshot { margin: 10px 0; border: 1px solid #ddd; padding:4px; }
          .meta { font-size:0.9em; color:#555 }
          hr { border:none; border-top:1px solid #e0e0e0; margin:30px 0; }
          </style>
          </head>
          <body>
          <h1>Essential Blocks — Combined PHP Compatibility Report</h1>
          <p class="meta">Generated on $(date -u)</p>
          HTML

          echo "<h2>Per-PHP Compatibility Summaries</h2>" >> final/combined.html
          for dir in allreports/*; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            ver=$(echo "$dirname" | sed 's/perphp-reports-//')
            echo "<h3>PHP: ${ver}</h3>" >> final/combined.html
            # phpcompat txt
            if [ -f "$dir/phpcompat/phpcompat-${ver}.txt" ]; then
              echo "<h4>PHPCompatibility</h4><pre>" >> final/combined.html
              sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' "$dir/phpcompat/phpcompat-${ver}.txt" >> final/combined.html
              echo "</pre>" >> final/combined.html
            fi
            # fatal logs
            if [ -f "$dir/fatal/fatal-${ver}.log" ]; then
              echo "<h4>Fatal / Admin Check</h4><pre>" >> final/combined.html
              sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' "$dir/fatal/fatal-${ver}.log" >> final/combined.html
              echo "</pre>" >> final/combined.html
            fi
            # WP debug logs
            if [ -f "$dir/wpdebug/debug-${ver}.log" ]; then
              echo "<h4>WP Debug Log</h4><pre>" >> final/combined.html
              sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' "$dir/wpdebug/debug-${ver}.log" >> final/combined.html
              echo "</pre>" >> final/combined.html
            fi
            # embed screenshots
            echo "<h4>Screenshots</h4>" >> final/combined.html
            for img in "$dir"/screens/*.jpg; do
              [ -f "$img" ] || continue
              cp "$img" final/
              imgname=$(basename "$img")
              echo "<div class='screenshot'><strong>${imgname}</strong><br/><img src='${imgname}' style='max-width:100%; width:900px; height:auto;'></div>" >> final/combined.html
              rm -f "$img" # delete after embedding
            done
            echo "<hr>" >> final/combined.html
          done

          echo "</body></html>" >> final/combined.html

      - name: Generate combined PDF
        run: wkhtmltopdf --enable-local-file-access final/combined.html final/combined.pdf || echo "PDF generation failed"

      - name: Upload FINAL combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: essential-blocks-wp-compat-final
          path: final/
          retention-days: 30
