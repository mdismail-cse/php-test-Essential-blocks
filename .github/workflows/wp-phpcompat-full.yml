name: WP PHP Fatal Compatibility (free + pro + controls × all PHP versions)

# PURPOSE
# -------
# Detect whether any of the three repos (Essential Blocks free, Pro, and the
# src/controls submodule) triggers a PHP FATAL or a PHP-version incompatibility
# on any supported PHP version inside a real WordPress install.
#
# Design rule: a green report MUST mean "we actually tested and found nothing".
# If a test could not run (build/install/auth/server/scan failure) the leg is
# reported as INCONCLUSIVE — never as PASS. A real fatal makes the whole run red.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Essential Blocks (free) branch to test'
        required: true
        default: 'master'
      controls_branch:
        description: 'src/controls submodule branch to test'
        required: false
        default: 'master'
      pro_branch:
        description: 'Essential Blocks Pro branch to test'
        required: false
        default: 'main'

permissions:
  contents: write   # gh-pages deploy
  pages: write
  id-token: write

# Avoid two dispatches racing on the gh-pages branch / report.
concurrency:
  group: phpcompat-${{ github.ref }}
  cancel-in-progress: true

env:
  WP_DB_NAME: wp
  WP_DB_USER: root
  WP_DB_PASS: root
  WP_URL: http://127.0.0.1:8080
  WP_ADMIN_USER: admin
  WP_ADMIN_PASS: admin

jobs:
  phpcompat:
    name: PHP ${{ matrix.php }} fatal check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Quoted so "8.0"/"8.5" are not parsed as floats (which setup-php would
        # resolve to the latest x.x and silently test the wrong version).
        php: ['8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4']

    steps:
      - name: Checkout Essential Blocks (free)
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/essential-blocks
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.ESSENTIAL_BLOCKS_PAT }}
          path: essential-blocks
          submodules: recursive

      - name: Checkout Essential Blocks Pro
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/essential-blocks-pro
          ref: ${{ github.event.inputs.pro_branch }}
          token: ${{ secrets.ESSENTIAL_BLOCKS_PAT }}
          path: essential-blocks-pro

      - name: Initialize per-leg summary (defaults = "untested")
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          mkdir -p "reports/${{ matrix.php }}/setup" \
                   "reports/${{ matrix.php }}/build" \
                   "reports/${{ matrix.php }}/phpcompat" \
                   "reports/${{ matrix.php }}/fatal" \
                   "reports/${{ matrix.php }}/wpdebug" \
                   "reports/${{ matrix.php }}/screens"
          cat > "$SUMMARY" <<EOF
          PHP=${{ matrix.php }}
          CONTROLS_BRANCH=${{ github.event.inputs.controls_branch }}
          FREE_BRANCH=${{ github.event.inputs.branch }}
          PRO_BRANCH=${{ github.event.inputs.pro_branch }}
          BUILD_CONTROLS=skipped
          BUILD_FREE=unknown
          BUILD_PRO=unknown
          WP_INSTALL=unknown
          PLUGINS_ACTIVE=unknown
          SERVER=unknown
          AUTH=unknown
          PHPCOMPAT_RAN=no
          PHPCOMPAT_ERRORS=0
          PHPCOMPAT_WARNINGS=0
          RUNTIME_PAGES=0
          RUNTIME_FATALS=0
          RUNTIME_INCONCLUSIVE=0
          DEBUGLOG_FATALS=0
          EOF
          echo "Initialized $SUMMARY"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          # Key on pnpm-lock (this is a pnpm repo; there is no package-lock.json).
          key: puppeteer-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Build controls + Essential Blocks (free)
        run: |
          SUMMARY="$(pwd)/reports/${{ matrix.php }}/summary.env"
          BUILD_DIR="$(pwd)/reports/${{ matrix.php }}/build"
          ERRLOG="$(pwd)/reports/${{ matrix.php }}/setup/errors.log"

          cd essential-blocks
          git submodule update --init --recursive 2>&1 | tee "$BUILD_DIR/submodule.log" || echo "Submodule init failed" >> "$ERRLOG"

          # Switch controls to requested branch (one of the three tested repos).
          controls_status=skipped
          if [ -n "${{ github.event.inputs.controls_branch }}" ] && [ -d "src/controls" ]; then
            ( cd src/controls
              git fetch origin
              git checkout -B "${{ github.event.inputs.controls_branch }}" "origin/${{ github.event.inputs.controls_branch }}"
            ) 2>&1 | tee "$BUILD_DIR/controls-branch.log" || echo "Controls branch checkout failed" >> "$ERRLOG"
          fi

          # Build controls.
          if [ -d "src/controls" ]; then
            controls_status=ok
            ( cd src/controls && pnpm install ) 2>&1 | tee "$BUILD_DIR/controls-install.log" || controls_status=fail
            ( cd src/controls && pnpm run build ) 2>&1 | tee "$BUILD_DIR/controls-build.log" || controls_status=fail
          fi

          # Build free.
          free_status=ok
          pnpm install 2>&1 | tee "$BUILD_DIR/free-install.log" || free_status=fail
          pnpm run build 2>&1 | tee "$BUILD_DIR/free-build.log" || free_status=fail

          # The plugin entry file must exist or there is nothing to test.
          if [ ! -f "essential-blocks.php" ]; then
            free_status=fail
            echo "Free plugin main file missing" >> "$ERRLOG"
          fi

          echo "BUILD_CONTROLS=$controls_status" >> "$SUMMARY"
          echo "BUILD_FREE=$free_status" >> "$SUMMARY"
          echo "controls=$controls_status free=$free_status"

      - name: Build Essential Blocks Pro
        run: |
          SUMMARY="$(pwd)/reports/${{ matrix.php }}/summary.env"
          BUILD_DIR="$(pwd)/reports/${{ matrix.php }}/build"
          ERRLOG="$(pwd)/reports/${{ matrix.php }}/setup/errors.log"

          cd essential-blocks-pro
          pro_status=ok
          pnpm install 2>&1 | tee "$BUILD_DIR/pro-install.log" || pro_status=fail
          pnpm run build 2>&1 | tee "$BUILD_DIR/pro-build.log" || pro_status=fail

          if [ ! -f "essential-blocks-pro.php" ]; then
            pro_status=fail
            echo "Pro plugin main file missing" >> "$ERRLOG"
          fi

          echo "BUILD_PRO=$pro_status" >> "$SUMMARY"
          echo "pro=$pro_status"

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, wp-cli
          extensions: mbstring, intl, curl, zip, xml, json, mysqli

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # Puppeteer ships its own Chromium; we only need MySQL + basic tooling.
          sudo apt-get install -y default-mysql-server curl wget unzip git

      - name: Install PHPCompatibilityWP
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "squizlabs/php_codesniffer:^3.0" "dealerdirect/phpcodesniffer-composer-installer:*" "phpcompatibility/phpcompatibility-wp:*" --no-interaction
          COMPOSER_HOME=$(composer config --global home)
          echo "$COMPOSER_HOME/vendor/bin" >> $GITHUB_PATH
          $COMPOSER_HOME/vendor/bin/phpcs --config-set installed_paths \
            $COMPOSER_HOME/vendor/phpcompatibility/php-compatibility,$COMPOSER_HOME/vendor/phpcompatibility/phpcompatibility-paragonie,$COMPOSER_HOME/vendor/phpcompatibility/phpcompatibility-wp
          $COMPOSER_HOME/vendor/bin/phpcs -i

      - name: Prepare WordPress
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          ERRLOG="reports/${{ matrix.php }}/setup/errors.log"

          sudo /etc/init.d/mysql start || echo "MySQL start failed" >> "$ERRLOG"

          # PHP < 8.0 + MySQL 8 default auth plugin (caching_sha2_password) breaks
          # mysqli. Switch root to mysql_native_password for those versions.
          # Numeric version compare via sort -V (the old string compare never fired).
          PHPV="${{ matrix.php }}"
          if [ "$(printf '%s\n8.0\n' "$PHPV" | sort -V | head -1)" = "$PHPV" ] && [ "$PHPV" != "8.0" ]; then
            echo "PHP $PHPV: forcing mysql_native_password for root"
            mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;" \
              2>&1 | tee reports/${{ matrix.php }}/setup/mysql-config.log || true
          fi

          mysql -e "CREATE DATABASE ${WP_DB_NAME};" -u${WP_DB_USER} -p${WP_DB_PASS} \
            2>&1 | tee reports/${{ matrix.php }}/setup/db-create.log || echo "Database creation failed" >> "$ERRLOG"

          wp core download --allow-root 2>&1 | tee reports/${{ matrix.php }}/setup/wp-download.log || echo "WordPress download failed" >> "$ERRLOG"

          # WP_DEBUG_DISPLAY=false so fatals do not pollute screenshots; we detect
          # them via HTTP 500 (white screen of death) and debug.log instead.
          wp config create --dbname=${WP_DB_NAME} --dbuser=${WP_DB_USER} --dbpass="${WP_DB_PASS}" \
            --dbhost=127.0.0.1 --allow-root --extra-php <<'PHP' 2>&1 | tee reports/${{ matrix.php }}/setup/wp-config.log || echo "wp-config creation failed" >> "$ERRLOG"
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP

      - name: Install WordPress
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          status=ok
          wp core install --url="${WP_URL}" --title="WP Test" \
            --admin_user="${WP_ADMIN_USER}" --admin_password="${WP_ADMIN_PASS}" \
            --admin_email="admin@example.com" --skip-email --allow-root \
            2>&1 | tee reports/${{ matrix.php }}/setup/wp-install.log || status=fail
          # Confirm WP actually responds to CLI (catches a half-broken install).
          wp option get siteurl --allow-root >/dev/null 2>&1 || status=fail
          echo "WP_INSTALL=$status" >> "$SUMMARY"

      - name: Copy plugins into WP
        run: |
          # rsync excludes node_modules/.git (large, irrelevant) but KEEPS vendor
          # (composer autoload is required at runtime — excluding it would fatal).
          rsync -a --exclude node_modules --exclude .git \
            essential-blocks/ wp-content/plugins/essential-blocks/ \
            2>&1 | tee reports/${{ matrix.php }}/setup/plugin-copy.log || echo "Plugin copy failed" >> reports/${{ matrix.php }}/setup/errors.log
          rsync -a --exclude node_modules --exclude .git \
            essential-blocks-pro/ wp-content/plugins/essential-blocks-pro/ \
            2>&1 | tee reports/${{ matrix.php }}/setup/pro-plugin-copy.log || echo "Pro plugin copy failed" >> reports/${{ matrix.php }}/setup/errors.log

      - name: Activate plugins
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          af=ok; ap=ok
          wp plugin activate essential-blocks --allow-root 2>&1 | tee reports/${{ matrix.php }}/setup/plugin-activate.log || af=fail
          wp plugin activate essential-blocks-pro --allow-root 2>&1 | tee reports/${{ matrix.php }}/setup/pro-plugin-activate.log || ap=fail
          if [ "$af" = "fail" ]; then state=fail; elif [ "$ap" = "fail" ]; then state=partial; else state=ok; fi
          echo "PLUGINS_ACTIVE=$state" >> "$SUMMARY"
          echo "free_active=$af pro_active=$ap -> $state"

      - name: Start WP built-in server (multi-worker)
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          # PHP_CLI_SERVER_WORKERS lets the built-in server handle the concurrent
          # sub-requests an admin page makes (admin-ajax/REST/assets). Without it
          # the single-threaded server deadlocks and pages time out blank.
          PHP_CLI_SERVER_WORKERS=8 nohup wp server --host=127.0.0.1 --port=8080 --path=. --allow-root > wpserver.log 2>&1 &
          status=fail
          for i in {1..20}; do
            if curl -s -o /dev/null "${WP_URL}"; then status=ok; echo "Server ready (attempt $i)"; break; fi
            sleep 2
          done
          if [ "$status" = "fail" ]; then
            echo "WordPress server failed to start" >> reports/${{ matrix.php }}/setup/errors.log
            cat wpserver.log >> reports/${{ matrix.php }}/setup/errors.log || true
          fi
          echo "SERVER=$status" >> "$SUMMARY"

      - name: PHPCompatibility scan (static, all three repos)
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          OUT="reports/${{ matrix.php }}/phpcompat"
          # Single run, two reports. Non-zero exit just means violations found.
          phpcs \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion "${{ matrix.php }}" \
            --extensions=php \
            --ignore='*/node_modules/*,*/.pnpm/*' \
            --report-full="$OUT/phpcompat-${{ matrix.php }}.txt" \
            --report-json="$OUT/phpcompat-${{ matrix.php }}.json" \
            wp-content/plugins/essential-blocks \
            wp-content/plugins/essential-blocks-pro || true

          JSON="$OUT/phpcompat-${{ matrix.php }}.json"
          if [ -f "$JSON" ]; then
            # Parse authoritative totals with PHP (no fragile grep -c line counting).
            # Note the trailing "\n" in each echo: without it `read` hits EOF
            # before a newline, returns non-zero, and `set -e` would abort here.
            # The `|| true` is belt-and-suspenders (read still populates the vars).
            read RAN ERRS WARN < <(php -r '
              $f=$argv[1];
              $j=json_decode(@file_get_contents($f),true);
              if(!is_array($j)||!isset($j["totals"])){echo "no 0 0\n";exit;}
              echo "yes ".(int)$j["totals"]["errors"]." ".(int)$j["totals"]["warnings"]."\n";
            ' "$JSON") || true
          else
            RAN=no; ERRS=0; WARN=0
          fi
          echo "PHPCOMPAT_RAN=$RAN" >> "$SUMMARY"
          echo "PHPCOMPAT_ERRORS=$ERRS" >> "$SUMMARY"
          echo "PHPCOMPAT_WARNINGS=$WARN" >> "$SUMMARY"
          echo "phpcompat ran=$RAN errors=$ERRS warnings=$WARN"

      - name: Runtime fatal check + screenshots (single Puppeteer auth path)
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          SCREEN_DIR="reports/${{ matrix.php }}/screens"
          RUNLOG="reports/${{ matrix.php }}/fatal/runtime-${{ matrix.php }}.log"
          mkdir -p "$SCREEN_DIR"
          : > "$RUNLOG"

          # One auth mechanism only: Puppeteer logs in with the real password,
          # then for every target reports a verdict: OK / FATAL / INCONCLUSIVE.
          cat > runtime.js <<'ENDJS'
          const puppeteer = require('puppeteer');
          (async () => {
            const [targetUrl, outputFile, name] = process.argv.slice(2);
            const URL = process.env.WP_URL;
            const USER = process.env.WP_ADMIN_USER;
            const PASS = process.env.WP_ADMIN_PASS;
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 1920, height: 1080 });
              await page.goto(URL + '/wp-login.php', { waitUntil: 'networkidle2', timeout: 30000 });
              await page.waitForSelector('#user_login', { timeout: 10000 });
              await page.type('#user_login', USER);
              await page.type('#user_pass', PASS);
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 20000 }).catch(() => {}),
                page.click('#wp-submit'),
              ]);
              if (page.url().includes('wp-login.php')) {
                console.log('VERDICT|' + name + '|LOGIN_FAILED|auth');
                await page.screenshot({ path: outputFile, type: 'jpeg', quality: 85 }).catch(() => {});
                await browser.close();
                process.exit(3);
              }
              const resp = await page.goto(targetUrl, { waitUntil: 'networkidle2', timeout: 45000 });
              const httpStatus = resp ? resp.status() : 0;
              await new Promise(r => setTimeout(r, 2000));
              const body = await page.content();
              await page.screenshot({ path: outputFile, type: 'jpeg', quality: 85 }).catch(() => {});
              let verdict = 'OK';
              if (page.url().includes('wp-login.php')) verdict = 'INCONCLUSIVE';      // lost session
              else if (httpStatus >= 500) verdict = 'FATAL';                          // WSOD
              else if (/<b>\s*Fatal error\s*<\/b>|Fatal error:|Parse error:|Uncaught (Error|Exception)/.test(body)) verdict = 'FATAL';
              console.log('VERDICT|' + name + '|' + verdict + '|http' + httpStatus);
              await browser.close();
              process.exit(verdict === 'FATAL' ? 1 : 0);
            } catch (e) {
              console.log('VERDICT|' + name + '|INCONCLUSIVE|' + String(e.message || 'error').slice(0, 80).replace(/\|/g, ' '));
              try { await browser.close(); } catch (_) {}
              process.exit(4);
            }
          })();
          ENDJS

          puppeteer_ok=yes
          npm install --prefer-offline puppeteer 2>&1 | tail -5 || puppeteer_ok=no
          if [ "$puppeteer_ok" = "no" ]; then npm install puppeteer 2>&1 | tail -5 || puppeteer_ok=no; fi

          # Frontend + admin + editor surfaces, free-only and free+pro.
          TARGETS=(
            "${WP_URL}/ frontend_home"
            "${WP_URL}/wp-admin/ dashboard"
            "${WP_URL}/wp-admin/plugins.php plugins"
            "${WP_URL}/wp-admin/admin.php?page=essential-blocks&tab=options eb_options"
            "${WP_URL}/wp-admin/admin.php?page=eb-quick-setup eb_quick_setup"
            "${WP_URL}/wp-admin/post-new.php?post_type=post editor_post"
            "${WP_URL}/wp-admin/post-new.php?post_type=page editor_page"
          )

          pages=0; fatals=0; inconclusive=0; auth=ok
          if [ "$puppeteer_ok" = "no" ]; then
            echo "Puppeteer install failed; runtime check could not run" | tee -a "$RUNLOG"
            auth=fail
          else
            for t in "${TARGETS[@]}"; do
              url=$(echo "$t" | awk '{print $1}')
              name=$(echo "$t" | awk '{print $2}')
              jpg="$SCREEN_DIR/${{ matrix.php }}_${name}.jpg"

              # eb_quick_setup is a free-only screen: deactivate Pro around it.
              if [ "$name" = "eb_quick_setup" ]; then
                wp plugin deactivate essential-blocks-pro --allow-root >/dev/null 2>&1 || true
              fi

              out=$(WP_URL="$WP_URL" WP_ADMIN_USER="$WP_ADMIN_USER" WP_ADMIN_PASS="$WP_ADMIN_PASS" \
                    node runtime.js "$url" "$jpg" "$name" 2>&1) || true
              echo "$out" | tee -a "$RUNLOG"

              if [ "$name" = "eb_quick_setup" ]; then
                wp plugin activate essential-blocks-pro --allow-root >/dev/null 2>&1 || true
              fi

              # `|| true`: if node crashed without printing a VERDICT line, grep
              # fails and (with pipefail) `var=$(...)` would trip `set -e`. Empty
              # verdict falls through to the *) case below = INCONCLUSIVE.
              verdict=$(echo "$out" | grep '^VERDICT|' | tail -1 | cut -d'|' -f3 || true)
              pages=$((pages + 1))
              case "$verdict" in
                FATAL)        fatals=$((fatals + 1)) ;;
                OK)           : ;;
                LOGIN_FAILED) auth=fail; inconclusive=$((inconclusive + 1)) ;;
                *)            inconclusive=$((inconclusive + 1)) ;;
              esac
            done
          fi

          echo "AUTH=$auth" >> "$SUMMARY"
          echo "RUNTIME_PAGES=$pages" >> "$SUMMARY"
          echo "RUNTIME_FATALS=$fatals" >> "$SUMMARY"
          echo "RUNTIME_INCONCLUSIVE=$inconclusive" >> "$SUMMARY"
          echo "runtime: pages=$pages fatals=$fatals inconclusive=$inconclusive auth=$auth"

      - name: Save & scan WP debug.log
        run: |
          SUMMARY="reports/${{ matrix.php }}/summary.env"
          DEST="reports/${{ matrix.php }}/wpdebug/debug-${{ matrix.php }}.log"
          fatals=0
          if [ -f wp-content/debug.log ]; then
            cp wp-content/debug.log "$DEST" || true
            fatals=$(grep -c "PHP Fatal error" "$DEST" 2>/dev/null || true)
            fatals=${fatals:-0}
          fi
          echo "DEBUGLOG_FATALS=$fatals" >> "$SUMMARY"
          echo "debug.log fatals=$fatals"

      - name: Show leg summary
        if: always()
        run: |
          echo "===== reports/${{ matrix.php }}/summary.env ====="
          cat "reports/${{ matrix.php }}/summary.env" || echo "(no summary written)"

      - name: Upload per-PHP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perphp-reports-${{ matrix.php }}
          path: reports/${{ matrix.php }}
          retention-days: 7

  combine:
    name: Combine reports + compute verdict
    runs-on: ubuntu-latest
    needs: phpcompat
    if: always()   # still produce a report even if a matrix leg failed hard

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allreports

      - name: Setup Node.js (for PDF)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build combined HTML + compute trustworthy verdict
        run: |
          mkdir -p final
          REPORT_DATE=$(date -u '+%B %d, %Y at %H:%M:%S UTC')

          # get KEY from a summary.env (last value wins; defaults are written first)
          # `|| true` so a missing/empty key never trips `set -e` in `var=$(get ...)`.
          get() { grep -E "^$2=" "$1" 2>/dev/null | tail -1 | cut -d= -f2- || true ; }
          num() { v=$(get "$1" "$2"); echo "${v:-0}" | tr -dc '0-9'; }

          cat > final/combined.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"/>
          <title>Essential Blocks — PHP Fatal Compatibility</title>
          <style>
          body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.6;margin:0;padding:20px;color:#333;background:#f5f5f5;}
          .container{max-width:1200px;margin:0 auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
          h1{color:#1a1a1a;border-bottom:3px solid #0073aa;padding-bottom:10px;}
          h2{color:#0073aa;margin-top:30px;} h3{color:#333;background:#f0f0f0;padding:10px;border-left:4px solid #0073aa;}
          .status{display:inline-block;padding:4px 12px;border-radius:4px;font-weight:bold;font-size:.9em;}
          .pass{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
          .fail{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
          .inconclusive{background:#fff3cd;color:#856404;border:1px solid #ffeaa7;}
          pre{background:#f8f9fa;padding:12px;border-radius:4px;overflow:auto;border:1px solid #dee2e6;font-size:.85em;}
          .screenshot{margin:15px 0;border:2px solid #dee2e6;padding:8px;border-radius:4px;}
          .meta{font-size:.9em;color:#666;} table{width:100%;border-collapse:collapse;margin:20px 0;}
          th,td{padding:12px;text-align:left;border-bottom:1px solid #dee2e6;} th{background:#f8f9fa;font-weight:600;}
          .num{font-weight:bold;} hr{border:none;border-top:2px solid #e9ecef;margin:40px 0;}
          .legend{font-size:.85em;color:#555;background:#f8f9fa;padding:10px 15px;border-radius:4px;border-left:4px solid #0073aa;}
          </style></head><body><div class="container">
          <h1>🔍 Essential Blocks — PHP Fatal Compatibility</h1>
          HTML

          cat >> final/combined.html <<EOF
          <p class="meta"><strong>📅 Generated:</strong> ${REPORT_DATE} &nbsp;|&nbsp; <strong>🔢 Run:</strong> #${{ github.run_number }}</p>
          <p class="meta"><strong>Branches</strong> — free: <code>${{ github.event.inputs.branch }}</code>, pro: <code>${{ github.event.inputs.pro_branch }}</code>, controls: <code>${{ github.event.inputs.controls_branch }}</code></p>
          <div class="legend"><strong>Verdict meaning:</strong>
          <span class="status pass">PASS</span> tested, no fatal/incompat found &nbsp;
          <span class="status fail">FAIL</span> a real PHP fatal or version incompatibility was found &nbsp;
          <span class="status inconclusive">INCONCLUSIVE</span> could not be reliably tested (build/install/auth/server/scan gap) — do not treat as pass.</div>
          <h2>📊 Summary</h2>
          <table><tr><th>PHP</th><th>Verdict</th><th>PHPCompat errors</th><th>Runtime fatals</th><th>debug.log fatals</th><th>Why</th></tr>
          EOF

          ANY_FAIL=0
          LEG_COUNT=0
          for dir in allreports/*; do
            [ -d "$dir" ] || continue
            ver=$(basename "$dir" | sed 's/perphp-reports-//')
            SUM="$dir/summary.env"
            LEG_COUNT=$((LEG_COUNT + 1))

            if [ ! -f "$SUM" ]; then
              verdict="INCONCLUSIVE"; vclass="inconclusive"; why="leg did not report (died before summary)"
              pe=0; rf=0; df=0
            else
              pe=$(num "$SUM" PHPCOMPAT_ERRORS); rf=$(num "$SUM" RUNTIME_FATALS); df=$(num "$SUM" DEBUGLOG_FATALS)
              wp_install=$(get "$SUM" WP_INSTALL); server=$(get "$SUM" SERVER); auth=$(get "$SUM" AUTH)
              ran=$(get "$SUM" PHPCOMPAT_RAN); active=$(get "$SUM" PLUGINS_ACTIVE); rinc=$(num "$SUM" RUNTIME_INCONCLUSIVE)

              if [ "${pe:-0}" -gt 0 ] || [ "${rf:-0}" -gt 0 ] || [ "${df:-0}" -gt 0 ]; then
                verdict="FAIL"; vclass="fail"
                why="$pe phpcompat err, $rf runtime fatal, $df debug.log fatal"
              elif [ "$wp_install" != "ok" ] || [ "$server" != "ok" ] || [ "$auth" != "ok" ] || [ "$ran" != "yes" ] || [ "$active" = "fail" ] || [ "${rinc:-0}" -gt 0 ]; then
                verdict="INCONCLUSIVE"; vclass="inconclusive"
                why="install=$wp_install server=$server auth=$auth scan=$ran active=$active runtime_inconclusive=$rinc"
              else
                verdict="PASS"; vclass="pass"; why="tested, clean"
              fi
            fi
            [ "$verdict" = "FAIL" ] && ANY_FAIL=1

            echo "<tr><td><strong>PHP ${ver}</strong></td><td><span class='status ${vclass}'>${verdict}</span></td><td class='num'>${pe}</td><td class='num'>${rf}</td><td class='num'>${df}</td><td>${why}</td></tr>" >> final/combined.html
          done
          echo "</table>" >> final/combined.html
          printf 'ANY_FAIL=%s\nLEG_COUNT=%s\n' "$ANY_FAIL" "$LEG_COUNT" > final/verdict.flag

          # ---- Detailed sections ----
          echo "<h2>📋 Details</h2>" >> final/combined.html
          for dir in allreports/*; do
            [ -d "$dir" ] || continue
            ver=$(basename "$dir" | sed 's/perphp-reports-//')
            SUM="$dir/summary.env"
            echo "<h3>PHP ${ver}</h3>" >> final/combined.html

            if [ -f "$SUM" ]; then
              echo "<details open><summary>Leg summary</summary><pre>" >> final/combined.html
              sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' "$SUM" >> final/combined.html
              echo "</pre></details>" >> final/combined.html
            fi

            for pair in \
              "phpcompat/phpcompat-${ver}.txt:PHPCompatibility (static)" \
              "fatal/runtime-${ver}.log:Runtime fatal check" \
              "wpdebug/debug-${ver}.log:WP debug.log" \
              "setup/errors.log:Setup errors"; do
              f="$dir/${pair%%:*}"; label="${pair#*:}"
              if [ -f "$f" ] && [ -s "$f" ]; then
                echo "<details><summary>${label}</summary><pre>" >> final/combined.html
                sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' "$f" >> final/combined.html
                echo "</pre></details>" >> final/combined.html
              fi
            done

            shots=0
            for img in "$dir"/screens/*.jpg; do [ -f "$img" ] && shots=$((shots+1)); done
            if [ "$shots" -gt 0 ]; then
              echo "<h4>📸 Screenshots (${shots})</h4>" >> final/combined.html
              for img in "$dir"/screens/*.jpg; do
                [ -f "$img" ] || continue
                cp "$img" final/
                base=$(basename "$img")
                page=$(echo "$base" | sed "s/${ver}_//;s/\.jpg$//;s/_/ /g")
                echo "<div class='screenshot'><strong>📄 ${page}</strong><br/><img src='${base}' style='max-width:100%;width:900px;height:auto;'></div>" >> final/combined.html
              done
            fi
            echo "<hr>" >> final/combined.html
          done

          echo "</div></body></html>" >> final/combined.html

      - name: Generate PDF (headless Chromium)
        run: |
          npm install puppeteer 2>&1 | tail -3 || true
          cat > print-pdf.js <<'ENDJS'
          const puppeteer = require('puppeteer');
          const path = require('path');
          (async () => {
            const [inp, out] = process.argv.slice(2);
            const b = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.goto('file://' + path.resolve(inp), { waitUntil: 'networkidle2', timeout: 60000 });
            await p.pdf({ path: out, format: 'A4', printBackground: true, margin: { top: '12mm', bottom: '12mm', left: '8mm', right: '8mm' } });
            await b.close();
          })();
          ENDJS
          node print-pdf.js final/combined.html final/combined.pdf || echo "PDF generation failed (HTML still available)"

      - name: Upload final combined artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-blocks-wp-compat-final
          path: final/
          retention-days: 30

      - name: Prepare GitHub Pages
        run: |
          mkdir -p gh-pages-deploy
          cp final/combined.html gh-pages-deploy/index.html
          cp final/*.jpg gh-pages-deploy/ 2>/dev/null || true
          cp final/combined.pdf gh-pages-deploy/ 2>/dev/null || true
          touch gh-pages-deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy report for run #${{ github.run_number }}'

      - name: Enforce verdict (fail the run if any leg is FAIL)
        run: |
          source final/verdict.flag 2>/dev/null || { ANY_FAIL=0; LEG_COUNT=0; }
          if [ "${LEG_COUNT:-0}" -eq 0 ]; then
            echo "::error::No PHP legs reported any results (likely a checkout/PAT/setup failure). Nothing was tested."
            exit 1
          fi
          if [ "${ANY_FAIL:-0}" -ne 0 ]; then
            echo "::error::A PHP fatal or version incompatibility was found in at least one PHP version. See the report."
            exit 1
          fi
          echo "Tested ${LEG_COUNT} PHP version(s). No FAIL verdicts. (INCONCLUSIVE legs, if any, are flagged in the report.)"
